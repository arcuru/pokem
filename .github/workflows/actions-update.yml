name: "Deps: Actions Update"

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      hold_days:
        description: "Days to hold before allowing merge"
        required: false
        default: "7"
        type: string

permissions:
  contents: read

jobs:
  actions-update:
    uses: arcuru/actions/.github/workflows/actions-update.yml@31c804a9c15602300e5e292e80cac1ad5512a21a # v0.2.0
    with:
      hold-days: ${{ inputs.hold_days || '7' }}
      environment: automation
    secrets:
      PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
