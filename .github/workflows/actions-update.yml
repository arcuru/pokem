# Monthly GitHub Actions version update: bumps SHA-pinned `uses:` lines to
# their latest releases and opens a PR on the deps/actions-update branch with
# a configurable hold period before merge. Delegates to the arcuru/actions
# reusable workflow; CI verifies via the normal PR checks.
name: "Deps: Actions Update"

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      hold_days:
        description: "Days to hold before allowing merge"
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  actions-update:
    uses: arcuru/actions/.github/workflows/actions-update.yml@ec6897e9561bdefa62d5eb364d49b41bcba122a5 # v0.4.0
    with:
      hold-days: ${{ inputs.hold_days || '7' }}
      environment: automation
