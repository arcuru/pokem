name: "Deps: Actions Update"

on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      hold_days:
        description: "Days to hold before allowing merge"
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  actions-update:
    uses: arcuru/actions/.github/workflows/actions-update.yml@c8144123ad5a2c6316b7becab8233b68dfa637d9 # v0.2.1
    with:
      hold-days: ${{ inputs.hold_days || '7' }}
      environment: automation
    secrets: inherit
