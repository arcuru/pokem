# Monthly Nix flake input update: runs `nix flake update` to bump flake.lock
# and opens a PR on the deps/flake-update branch with a configurable hold
# period before merge. Delegates to the arcuru/actions reusable workflow; CI
# verifies via the normal PR checks.
name: "Deps: Flake Update"

on:
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:
    inputs:
      hold_days:
        description: "Days to hold before allowing merge"
        required: false
        default: "7"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  flake-update:
    uses: arcuru/actions/.github/workflows/flake-update.yml@ec6897e9561bdefa62d5eb364d49b41bcba122a5 # v0.4.0
    with:
      hold-days: ${{ inputs.hold_days || '7' }}
      environment: automation
    secrets: inherit
