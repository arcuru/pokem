# Daily check of cargo dependencies against the RustSec Advisory Database.
# Opens or updates a GitHub issue labeled "security" on failure and auto-closes
# it when all advisories clear. Delegates to the arcuru/actions reusable
# workflow.
name: "Deps: Security Audit"

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    uses: arcuru/actions/.github/workflows/security-audit.yml@3cee03dd694bcbfe4a64ae899f4b9a7cbdfe357c # v0.5.0
