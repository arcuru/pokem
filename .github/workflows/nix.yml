name: Nix

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
      - name: Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@908b263ff629f4cc17666315b7fd3ec127c6244d # v14

      - name: Check
        # Runs all flake checks, which includes building the package.
        # `--inputs-from .` resolves nixpkgs to this repo's locked flake, so
        # CI runs the same nix-fast-build and nix-eval-jobs as the dev shell
        # instead of tracking the tool's own upstream HEAD.
        run: nix run --inputs-from . nixpkgs#nix-fast-build -- --skip-cached --no-nom
