# Mirrors main to the self-hosted Forgejo instance after every push. Delegates
# to the arcuru/actions reusable workflow, which pins the destination's host key
# rather than trusting it on first use.
name: Mirror

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  mirror:
    uses: arcuru/actions/.github/workflows/codeberg-mirror.yml@3cee03dd694bcbfe4a64ae899f4b9a7cbdfe357c # v0.5.0
    with:
      environment: mirror
      destination: git@code.jackson.dev:arcuru/pokem.git
      host: code.jackson.dev
      host-key: "code.jackson.dev ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGUJI+z0l5QHNh9hqf1Wx3YD4qJ1a8fdDBRLtXp4bzqf"
    secrets:
      ssh-private-key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
