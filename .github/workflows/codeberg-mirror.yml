name: Codeberg Sync
on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  codeberg:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'arcuru'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Mirror to Codeberg
        env:
          SSH_PRIVATE_KEY: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
          REMOTE: git@codeberg.org:arcuru/pokem.git
        run: |
          install -m 700 -d "$HOME/.ssh"
          install -m 600 /dev/null "$HOME/.ssh/id_codeberg"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_codeberg"

          # Pinned codeberg.org ed25519 host key (replaces yesolutions/mirror-action
          # and its GIT_SSH_NO_VERIFY_HOST flag; verified 2026-05-12). Pinning to
          # ed25519 only — HostKeyAlgorithms below forces ssh to require it.
          cat > "$HOME/.ssh/known_hosts" <<'HOSTS_EOF'
          codeberg.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIVIC02vnjFyL+I4RHfvIGNtOgJMe769VTF1VR4EB3ZB
          HOSTS_EOF
          chmod 600 "$HOME/.ssh/known_hosts"

          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/id_codeberg -o IdentitiesOnly=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o HostKeyAlgorithms=ssh-ed25519"
          git remote add mirror "$REMOTE"
          git push --mirror --force --prune mirror
